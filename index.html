<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moon Waves</title>
  <meta name="theme-color" content="#0b0314">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background: two layers that crossfade when the song changes -->
  <div id="bg" aria-hidden="true">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div id="bgDim"></div>
    <div id="grain"></div>
  </div>

  <main id="app">
    <!-- Screen 1: song list -->
    <section id="listPage" class="page" aria-label="Song list">
      <header class="list-head">
        <h1 id="listTitle">Moon Waves</h1>
      </header>
      <ul id="songList" class="song-list"></ul>
      <p id="listEmpty" class="empty" hidden></p>
    </section>

    <!-- Screen 2: player -->
    <section id="playerPage" class="page" aria-label="Player">
      <a id="backBtn" class="back" href="#/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span id="backLabel">Back</span>
      </a>

      <div class="card" id="card">
        <div class="now">
          <div class="cover" id="coverWrap"><img id="cover" alt=""></div>
          <div class="now-text">
            <h2 id="title">Title</h2>
            <p id="artist">Artist</p>
          </div>
        </div>

        <div class="lyrics" id="lyrics" tabindex="0" aria-label="Lyrics"></div>

        <div class="controls">
        <div class="seek">
          <input class="range" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
        </div>

        <div class="transport">
          <button class="mini" id="shuffle" type="button" aria-pressed="false" aria-label="Shuffle off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="ctl" id="prev" type="button" aria-label="Previous song">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2.2v12H6zM20 6v12L9.5 12z"/></svg>
          </button>
          <button class="ctl play" id="play" type="button" aria-label="Play">
            <svg id="iPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg id="iPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
          </button>
          <button class="ctl" id="next" type="button" aria-label="Next song">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.800 6H18v12h-2.200zM4 6v12l10.500-6z"/></svg>
          </button>
          <button class="mini" id="repeat" type="button" aria-pressed="false" aria-label="Repeat off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></svg>
            <b id="repeatOne" hidden>1</b>
          </button>
        </div>

        <div class="extras">
          <label class="slider" title="Volume">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM15.500 8.500a5 5 0 0 1 0 7M18.500 5.500a9 9 0 0 1 0 13"/></svg>
            <input class="range small" id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
          </label>
          <label class="slider" title="Background brightness">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg>
            <input class="range small" id="dim" type="range" min="0" max="100" value="60" aria-label="Background brightness">
          </label>
        </div>
        </div>
      </div>

      <button class="edit-btn" id="editBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span id="editLabel">Edit lyrics</span>
      </button>

      <p class="footer" id="footer"></p>
    </section>
  </main>

  <!-- Lyrics timing editor -->
  <div id="editor" class="editor" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="edTitle">
      <div class="ed-head">
        <h3 id="edTitle">Lyrics</h3>
        <button id="edClose" class="mini" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div id="edPaste" class="ed-step">
        <p class="ed-help">Paste the lyrics, one line per row. They stay in your browser and are not uploaded.</p>
        <textarea id="edText" rows="9" spellcheck="false" aria-label="Lyrics text"></textarea>
        <div class="ed-actions">
          <button id="edStart" class="btn primary" type="button">Start timing</button>
          <button id="edClear" class="btn" type="button">Remove saved lyrics</button>
        </div>
        <div class="ed-shift">
          <span>Lyrics a bit early or late?</span>
          <button id="edShiftE" class="btn" type="button">Earlier 0.5s</button>
          <button id="edShiftL" class="btn" type="button">Later 0.5s</button>
        </div>
      </div>

      <div id="edTime" class="ed-step" hidden>
        <p class="ed-help" id="edHelp">The song is playing. Press Tap (or Enter) the moment the highlighted line starts being sung.</p>
        <div id="edLines" class="ed-lines"></div>
        <div class="ed-actions">
          <button id="edTap" class="btn primary big" type="button">Tap</button>
          <button id="edUndo" class="btn" type="button">Undo</button>
          <button id="edPlay" class="btn" type="button">Pause</button>
          <button id="edRestart" class="btn" type="button">Restart</button>
        </div>
        <div id="edDone" class="ed-done" hidden>
          <div class="ed-actions">
            <button id="edMinus" class="btn" type="button">Earlier 0.1s</button>
            <button id="edPlus" class="btn" type="button">Later 0.1s</button>
          </div>
          <div class="ed-actions">
            <button id="edSave" class="btn primary" type="button">Save</button>
            <button id="edDownload" class="btn" type="button">Download .lrc</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <noscript><p style="color:#fff;padding:24px">This player needs JavaScript.</p></noscript>
  <script src="songs.js"></script>
  <script src="script.js"></script>
</body>
</html>
